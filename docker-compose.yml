services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      ADDR: ":8080"
      # Must match the origin the browser loads the frontend from.
      ALLOWED_ORIGIN: "http://localhost:5173"

  frontend:
    build:
      context: ./frontend
      args:
        # The URL the browser reaches, not the compose service name: the
        # request is made by the browser, which is outside the compose network.
        VITE_API_URL: "http://localhost:8080"
    ports:
      - "5173:80"
    depends_on:
      - backend
